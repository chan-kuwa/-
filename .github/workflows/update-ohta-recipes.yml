name: Update ohta recipe CSV

on:
  workflow_dispatch:
  schedule:
    - cron: '25 18 * * *'  # JST 03:25 every day
  push:
    paths:
      - "sync_ohta_recipes.py"
      - ".github/workflows/update-ohta-recipes.yml"

permissions:
  contents: write

jobs:
  update-ohta-recipes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Sync published recipes
        run: |
          success=0
          for attempt in 1 2 3; do
            echo "Recipe sync attempt ${attempt}/3"
            if python sync_ohta_recipes.py; then
              success=1
              break
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "Recipe sync failed; waiting 20 seconds before retry..."
              sleep 20
            fi
          done
          if [ "$success" -ne 1 ]; then
            echo "Recipe sync failed after 3 attempts."
            exit 1
          fi

      - name: Commit CSV changes
        run: |
          if git status --porcelain -- master_recipe_data.csv | grep -q .; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add master_recipe_data.csv
            git commit -m "Auto-update master recipe CSV [skip ci]"
            git push
          else
            echo "No recipe changes."
          fi
